     `src/test/index-sin-traductor.test.ts`. -->

    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LibraInmo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
