[project]
name = "librainmo"
version = "0.1.0"
description = "LibraInmo — administración de alquileres para inmobiliarias (familia Libra)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    # El auth de toda la familia (usuarios, sesión por cookie, auditoría,
    # Términos). Se declara con `git+https` como en el resto de los productos:
    # anda en dev local sin identidad SSH propia. `[migrations]` trae alembic
    # para correr la cadena de `libraauth` (`libraauth-migrar`), que versiona
    # sus propias tablas.
    "libraauth[migrations] @ git+https://github.com/marianocappucci/libraauth.git@v0.55.0",
    # El motor común. Acá el schema de `libracore`
    # (clientes, facturas, libro de terceros, recibos, índices de ajuste) vive en
    # la MISMA base que el dominio (ADR-002). `python -m app.migrar` corre su
    # cadena (`libracore.migrar.upgrade`) antes de la del dominio.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.196.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `plans.py` vive en la raíz (lo lee `libracore.provisioning`) y también tiene que
# viajar en la imagen, que instala el paquete sin modo editable.
[tool.setuptools]
py-modules = ["plans"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.File",
    "fastapi.Form", "fastapi.Header", "fastapi.Cookie", "fastapi.Body",
]

[tool.pytest.ini_options]
markers = [
    "sin_aceptar_terminos: deja al test afuera de la excepcion autouse del conftest, para medir el gate de Terminos con el corte puesto de verdad",
]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
show_missing = true
fail_under = 95
